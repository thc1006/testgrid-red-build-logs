[project]
name = "red-build-logs"
version = "0.1.0"
description = "Archive the Prow build-log.txt of red builds on the sig-release TestGrid dashboards"
requires-python = ">=3.12"
license = "Apache-2.0 AND BSD-3-Clause AND Unicode-DFS-2016"
dependencies = [
    "pyyaml>=6.0.3",
    "urllib3>=2.8,<3",  # (2.8: make_headers(proxy_basic_auth_encoding=...))
]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "cmarkgfm>=2025.10.22",
    "hypothesis>=6.169",
    "ruff",
    "shellcheck-py>=0.11.0.1",
    "zizmor>=1.30.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# test inputs written out in full, and bytes formatting (no f-strings for bytes)
"oracle/fuzz/edge.py" = ["E501", "UP031"]
