name: Test

# (and the files outside tool/ that tests read: .gitignore, the docs and the licenses)
on:
  push:
    paths: ["tool/**", ".github/workflows/**", ".gitignore", "README.md", "AGENTS.md", "THIRD_PARTY_NOTICES.md",
            "LICENSE", "third_party/**"]
  pull_request:
    paths: ["tool/**", ".github/workflows/**", ".gitignore", "README.md", "AGENTS.md", "THIRD_PARTY_NOTICES.md",
            "LICENSE", "third_party/**"]

permissions:
  contents: read # check out the code, nothing else

# A newer push or PR update supersedes a test run still in progress.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    # (the suite takes about 10 minutes, most of it waiting on the time limits it tests)
    timeout-minutes: 25
    defaults:
      run:
        shell: bash # bash -eo pipefail, not GitHub's default bash -e: a pipeline fails when any of its commands does
        working-directory: tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: tool/uv.lock
      # --locked: fail if uv.lock is out of date instead of re-resolving it in CI
      - run: uv run --locked ruff check .
      # The workflows: expressions, action inputs and outputs, and their shell
      # scripts (actionlint runs shellcheck on them), then security (zizmor).
      - run: uv run --locked actionlint ../.github/workflows/*.yml
      - run: uv run --locked zizmor --offline --persona auditor ../.github/workflows/
      - run: uv run --locked python -W error::ResourceWarning -m unittest -v
