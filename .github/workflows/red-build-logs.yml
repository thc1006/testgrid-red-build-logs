name: Archive red TestGrid build logs

on:
  schedule:
    # 00:17 and 12:17 UTC (08:17 and 20:17 in Taiwan). Off the hour because
    # GitHub delays or drops scheduled runs at busy times such as :00.
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions: {}

# One run at a time per branch. A run still waiting when a newer one for the same
# branch arrives is replaced by it, which loses nothing: every run rescans
# everything that is still red.
concurrency:
  group: red-build-logs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    name: Archive and verify
    # The commit step pushes back to the branch the run was started on.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    # More than the step timeouts below (5 + 50 + 20 + 10) plus checkout and
    # setup-uv, so the commit step always gets to run.
    timeout-minutes: 95
    permissions:
      contents: write # push the archive back to the branch
    steps:
      # Check out the branch tip, not the commit that triggered the run: a re-run
      # or a run queued behind another must build on what the last run pushed.
      # github.ref_name is the default branch for scheduled runs (their event
      # payload has no repository field) and the chosen branch for manual ones.
      # No credentials are kept in .git/config; only the commit step gets the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: tool/uv.lock

      # uv builds the environment from uv.lock (and fails if the lock is stale).
      - name: Set up the Python environment
        timeout-minutes: 5
        run: uv sync --no-dev --locked --project tool

      # On a timeout or cancel the runner signals only the step's own process:
      # SIGINT, then SIGTERM, then SIGKILL. exec makes that process Python itself,
      # so the tool stops cleanly; a bash or a uv in between would die first and
      # leave the tool still writing to archive/.
      - name: Fetch the build logs behind red TestGrid cells
        id: fetch
        continue-on-error: true
        timeout-minutes: 50
        run: exec tool/.venv/bin/python tool/fetch_red_logs.py --archive archive --gzip

      - name: Verify the archive against TestGrid and GCS
        id: verify
        continue-on-error: true
        timeout-minutes: 20
        run: exec tool/.venv/bin/python tool/cross_check.py --archive archive --hours 48

      # Commit whatever was archived even when a step failed or timed out (a step
      # timeout is a failure, not a cancellation). The run's report in its folder
      # under archive/runs/ says what went wrong; an interrupted fetch writes one
      # too, unless it was killed outright. A run cancelled before this step
      # pushes nothing.
      - name: Commit the archive
        id: commit
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d archive ]; then
            echo "No archive/ to commit."
            exit 0
          fi
          # A build folder without meta.json is a download that was cut off: leave
          # it out; the build is retried by a later run.
          shopt -s nullglob
          for d in archive/runs/*/*/*/*/; do
            [ -e "${d}meta.json" ] || rm -rf -- "$d"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -q -m "archive: red builds as of $(date -u +%Y-%m-%dT%H:%MZ)"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          for _ in 1 2 3; do
            # Without pack.useSparse=false, git sends again every file a commit only
            # moved (the one-time move to per-run folders: about 50 MB, not 0.5 MB).
            git -c pack.useSparse=false push && exit 0
            if ! git pull --rebase -q origin "$GITHUB_REF_NAME"; then
              git rebase --abort 2>/dev/null || true
              break
            fi
          done
          # Not pushed: keep this run's commit so it is not lost with the runner (see the next step).
          if git bundle create "$RUNNER_TEMP/unpushed-archive.bundle" "origin/$GITHUB_REF_NAME..HEAD"; then
            echo "bundle=$RUNNER_TEMP/unpushed-archive.bundle" >> "$GITHUB_OUTPUT"
          fi
          echo "::error::This run's results could not be pushed (the branch changed in a conflicting way, or pushing kept failing). Its commit is attached to this run as the unpushed-archive artifact, a zipped git bundle."
          exit 1

      # A git bundle of the commit that could not be pushed: unzip the artifact,
      # then `git fetch unpushed-archive.bundle HEAD` brings it back for a merge.
      - name: Keep the unpushed commit
        if: ${{ failure() && steps.commit.outputs.bundle != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpushed-archive
          path: ${{ steps.commit.outputs.bundle }}
          retention-days: 14

      - name: Fail the run if fetching or verifying failed
        if: steps.fetch.outcome == 'failure' || steps.verify.outcome == 'failure'
        env:
          FETCH: ${{ steps.fetch.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          echo "fetch: $FETCH, verify: $VERIFY"
          exit 1
