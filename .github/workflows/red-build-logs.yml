name: Archive red TestGrid build logs

on:
  schedule:
    # Twice a day is the aim, but GitHub starts scheduled runs late (5-6 hours
    # late here in October 2026) and drops most of them when it is busy (here it
    # started two a day, about 12 hours apart). So the schedule fires every 3
    # hours (off the hour, when GitHub is less busy), and a scheduled run
    # archives once in each half of the UTC day, and whenever the last archive is
    # 11 hours old (see the due job).
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions: {}

# A waiting run is replaced by a newer one of the same kind (scheduled, or started
# by hand) for the same branch, which loses nothing: every run rescans everything
# still red. The two kinds do not replace each other: a scheduled run that is not
# due would otherwise drop a manual run waiting behind a running one. The archive
# job itself runs one at a time per branch (its own concurrency group).
concurrency:
  group: red-build-logs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

# Run steps run under bash -eo pipefail, not GitHub's default bash -e: a pipeline
# fails when any of its commands does, not only its last. (A job that sets its own
# defaults.run replaces this one whole, so it must set shell: bash too.)
defaults:
  run:
    shell: bash

jobs:
  due:
    name: Decide whether to archive now
    # The commit step pushes back to the branch the run was started on.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # when the archive last changed
    outputs:
      due: ${{ steps.age.outputs.due }}
      age: ${{ steps.age.outputs.age }}
    steps:
      # Every archive run that gets to commit adds its folder under archive/runs/,
      # so the last commit there is when the archive last ran. A scheduled run
      # archives unless the archive changed in this half of the UTC day (00:00 to
      # 12:00, 12:00 to 24:00) less than 11 hours ago. By its age alone, an archive
      # made by hand between the two runs GitHub starts in a day would put the
      # next archive off by a day (one by hand at 19:30 UTC: the run at 05:55 found
      # it 10 hours old). A run started by hand, or any re-run, always archives.
      - id: age
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if ! last=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits" -f sha="$BRANCH" -f path=archive/runs \
              -f per_page=1 --jq '.[0].commit.committer.date // ""'); then
            echo "::warning::Could not read when the archive last changed."
            last=""
          fi
          # Not known (no archive yet, or the API failed): archive now, as one run too
          # many costs little, and do not call the archive late.
          if [ -z "$last" ] || ! changed=$(date -d "$last" +%s); then
            echo "The archive's age is not known; archiving now."
            echo "age=0" >> "$GITHUB_OUTPUT"
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date +%s)
          age=$(( now - changed ))
          echo "The archive last changed at $last, $((age / 3600)) hours ago."
          echo "age=$age" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != schedule ] || [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] || [ "$changed" -lt $((now / 43200 * 43200)) ] \
              || [ "$age" -ge $((11 * 3600)) ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not due yet: the archive changed in this half of the UTC day, less than 11 hours ago."
          fi

  archive:
    name: Archive and verify
    needs: due
    if: needs.due.outputs.due == 'true'
    concurrency:
      group: red-build-logs-archive-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # More than the step timeouts below (5 + 2 + 34 + 50 + 20 + 10) plus checkout and
    # setup-uv, so the commit step always gets to run.
    timeout-minutes: 130
    permissions:
      contents: write # push the archive back to the branch
    steps:
      # Check out the branch tip, not the commit that triggered the run: a re-run
      # or a run queued behind another must build on what the last run pushed.
      # github.ref_name is the default branch for scheduled runs (their event
      # payload has no repository field) and the chosen branch for manual ones.
      # No credentials are kept in .git/config; only the commit step gets the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: tool/uv.lock

      # uv builds the environment from uv.lock (and fails if the lock is stale).
      - name: Set up the Python environment
        timeout-minutes: 5
        run: uv sync --no-dev --locked --project tool

      # The rule builds TestGrid no longer shows are judged by follows the commit TestGrid
      # production runs (tool/oracle/pinned.json). If production moved, this run warns;
      # the oracle workflow (daily) checks the port against the new commit.
      - name: TestGrid production still runs the commit the port follows
        continue-on-error: true
        timeout-minutes: 2
        run: tool/oracle/drift.sh

      # TestGrid's config for the tabs over time: that of each run of test-infra's
      # upload job (TestGrid production takes what it uploads) the archive does not
      # have yet, built the way testgrid.k8s.io's was (tool/testgrid_config.sh: the
      # configurator image the job ran at that commit, with no network), newest first,
      # for up to 30 minutes (a backlog, such as the 18 days of runs a first listing
      # finds, takes a few runs); the rest are left to the next run. The rows each tab
      # showed and the options its builds were read with, to judge builds TestGrid no
      # longer shows. If this fails, the fetch uses what earlier runs read, and says so.
      - name: Read TestGrid's config from its upload job's runs
        continue-on-error: true
        timeout-minutes: 34
        env:
          PYTHON: tool/.venv/bin/python
          CONFIG_SECONDS: "1800"
        run: tool/testgrid_config.sh "$RUNNER_TEMP/testgrid-config.json" archive/state.json

      # On a timeout or cancel the runner signals only the step's own process:
      # SIGINT, then SIGTERM, then SIGKILL. exec makes that process Python itself,
      # so the tool stops cleanly; a bash or a uv in between would die first and
      # leave the tool still writing to archive/.
      - name: Fetch the build logs behind red TestGrid cells
        id: fetch
        continue-on-error: true
        timeout-minutes: 50
        run: exec tool/.venv/bin/python tool/fetch_red_logs.py --archive archive --gzip --testgrid-config "$RUNNER_TEMP/testgrid-config.json"

      - name: Verify the archive against TestGrid and GCS
        id: verify
        continue-on-error: true
        timeout-minutes: 20
        run: exec tool/.venv/bin/python tool/cross_check.py --archive archive --hours 48

      # Commit whatever was archived even when a step failed or timed out (a step
      # timeout is a failure, not a cancellation). The run's report in its folder
      # under archive/runs/ says what went wrong; an interrupted fetch writes one
      # too, unless it was killed outright. A run cancelled before this step
      # pushes nothing.
      - name: Commit the archive
        id: commit
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d archive ]; then
            echo "No archive/ to commit."
            exit 0
          fi
          # A build folder without meta.json is a download that was cut off: leave
          # it out; the build is retried by a later run.
          shopt -s nullglob
          for d in archive/runs/*/*/*/*/; do
            [ -e "${d}meta.json" ] || rm -rf -- "$d"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          # GitHub blocks files over 100 MiB, so the archive commits none over 95 MiB:
          # the fetch stores a larger log in parts, and the other files are small.
          # INDEX.md, index.json, a week's page or a chart that large (every run writes
          # them anew) is left out, and the version last committed stays, if any. Any
          # other file that large stops the commit, and nothing of this run is
          # committed: a build's file put back or left out would not be the one its
          # meta.json describes. (Only the files this commit adds or changes count: a
          # temp file of a download cut off part-way can be that large, but git
          # ignores it.)
          git diff --cached --name-only --no-renames --diff-filter=d -z > "$RUNNER_TEMP/staged"
          refuse=
          while IFS= read -r -d '' f; do
            size=$(stat -c %s -- "$f")
            [ "$size" -gt $((95 << 20)) ] || continue
            case $f in
              archive/INDEX.md | archive/index.json | archive/weeks/* | archive/charts/*)
                echo "::warning::Not committing $f ($size bytes): larger than 95 MiB. The version last committed stays, if any."
                if git cat-file -e "HEAD:$f" 2> /dev/null; then
                  git --literal-pathspecs checkout -q HEAD -- "$f"
                else
                  git --literal-pathspecs rm -q --cached -- "$f"
                  rm -f -- "$f"
                fi
                ;;
              *)
                echo "::error::$f ($size bytes) is larger than 95 MiB, the most the archive commits in one file (GitHub blocks files over 100 MiB)."
                refuse=1
                ;;
            esac
          done < "$RUNNER_TEMP/staged"
          if [ -n "$refuse" ]; then
            echo "::error::Nothing of this run is committed."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -q -m "archive: red builds as of $(date -u +%Y-%m-%dT%H:%MZ)"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          for _ in 1 2 3; do
            # Without pack.useSparse=false, git sends again every file a commit only
            # moved (the one-time move to per-run folders: about 50 MB, not 0.5 MB).
            git -c pack.useSparse=false push && exit 0
            if ! git pull --rebase -q origin "$GITHUB_REF_NAME"; then
              git rebase --abort 2>/dev/null || true
              break
            fi
          done
          # Not pushed: keep this run's commit so it is not lost with the runner (see the next step).
          if git bundle create "$RUNNER_TEMP/unpushed-archive.bundle" "origin/$GITHUB_REF_NAME..HEAD"; then
            echo "bundle=$RUNNER_TEMP/unpushed-archive.bundle" >> "$GITHUB_OUTPUT"
          fi
          echo "::error::This run's results could not be pushed (the branch changed in a conflicting way, or pushing kept failing). Its commit is attached to this run as the unpushed-archive artifact, a zipped git bundle."
          exit 1

      # A git bundle of the commit that could not be pushed: unzip the artifact,
      # then `git fetch unpushed-archive.bundle HEAD` brings it back for a merge.
      - name: Keep the unpushed commit
        if: ${{ failure() && steps.commit.outputs.bundle != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpushed-archive
          path: ${{ steps.commit.outputs.bundle }}
          retention-days: 14

      - name: Fail the run if fetching or verifying failed
        if: steps.fetch.outcome == 'failure' || steps.verify.outcome == 'failure'
        env:
          FETCH: ${{ steps.fetch.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          echo "fetch: $FETCH, verify: $VERIFY"
          exit 1

  # A gap is searched in GCS, so nothing is lost, but a day without an archive
  # means GitHub did not start the scheduled runs, or they did not get to commit:
  # a scheduled run that finds the archive that old fails, to say so.
  behind:
    name: Check that archiving keeps up
    needs: [due, archive]
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.archive.result != 'skipped' && fromJSON(needs.due.outputs.age) > 93600 }} # 26 hours
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          AGE: ${{ needs.due.outputs.age }}
          ARCHIVE: ${{ needs.archive.result }}
        run: |
          echo "::error::The archive was $((AGE / 3600)) hours old when this scheduled run started: for more than a day, GitHub did not start the scheduled runs or they did not commit (this run's archive job: $ARCHIVE)."
          exit 1

  # An outside check that GitHub keeps starting the schedule: a dead man's switch
  # (such as healthchecks.io) alerts when these pings stop, which GitHub cannot
  # do when it is the one not starting the workflow (a failed run it does email
  # about). Every scheduled run pings, about every 3 hours. Optional: set the
  # repository variable HEARTBEAT to "on", and the check's ping URL as the secret
  # HEARTBEAT_URL of the environment "heartbeat" (used without a deployment).
  heartbeat:
    name: Send the heartbeat
    needs: due
    if: vars.HEARTBEAT == 'on' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: heartbeat
      deployment: false
    permissions: {}
    steps:
      - env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "::warning::HEARTBEAT is on but the heartbeat environment has no HEARTBEAT_URL secret."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HEARTBEAT_URL" || echo "::warning::The heartbeat could not be sent."
